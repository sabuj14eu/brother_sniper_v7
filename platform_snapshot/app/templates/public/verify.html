{% extends "base.html" %}
{% block title %}Verify account — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
<h1 class="text-3xl font-extrabold text-white mb-2">Verify your account</h1>
<p class="text-slate-400 text-sm mb-6">We sent a 6-digit code to
  <strong class="text-white">{{ dest }}</strong>{% if '@' in dest %} — check your inbox (and spam folder){% endif %}.</p>
{% if error %}<div class="bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-xl p-3 mb-4 text-sm">{{ error }}</div>{% endif %}
<form method="post" action="/verify" class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
  <input type="hidden" name="dest" value="{{ dest }}">
  <input name="code" maxlength="6" inputmode="numeric" placeholder="123456" required autofocus
         class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-center text-2xl tracking-[0.5em] font-mono">
  <button class="mt-4 w-full bg-brand hover:bg-brand-dark text-slate-950 font-bold py-2.5 rounded-xl">Verify</button>
</form>
<form method="post" action="/verify/resend" class="text-center mt-4">
  <input type="hidden" name="dest" value="{{ dest }}">
  <button class="text-sm text-slate-500 hover:text-white">Resend code</button>
</form>
</div>
{% endblock %}
